kind = "video"
previewPath = "/meraki-video/"
title = "Meraki Promo Video"
version = "1.0.0"
id = "artifacts/meraki-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/meraki-video/" ]
localPort = 20335

[services.development]
run = "pnpm --filter @workspace/meraki-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/meraki-video", "run", "build" ]
publicDir = "artifacts/meraki-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20335"
BASE_PATH = "/meraki-video/"
