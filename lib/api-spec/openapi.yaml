openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Meraki on-demand home help service API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: workers
    description: Worker profiles and availability
  - name: services
    description: Service types
  - name: bookings
    description: Booking management
  - name: subscriptions
    description: Subscription plans
  - name: dashboard
    description: Dashboard aggregates

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Users ───────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ── Services ────────────────────────────────────────────────────────────────
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all available service types
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /services/{id}:
    get:
      operationId: getService
      tags: [services]
      summary: Get a service by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Workers ─────────────────────────────────────────────────────────────────
  /workers:
    get:
      operationId: listWorkers
      tags: [workers]
      summary: List workers, optionally filtered by service or availability
      parameters:
        - name: serviceId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          description: ISO date (YYYY-MM-DD) to check availability
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of workers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerListResponse"

  /workers/{id}:
    get:
      operationId: getWorker
      tags: [workers]
      summary: Get worker profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Worker profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "404":
          $ref: "#/components/responses/NotFound"

  /workers/{id}/reviews:
    get:
      operationId: getWorkerReviews
      tags: [workers]
      summary: Get reviews for a worker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Worker reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  # ── Bookings ─────────────────────────────────────────────────────────────────
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings for the current user
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BookingStatus"
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"

    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a new booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Update booking status (cancel, confirm, complete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingStatusRequest"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

  /bookings/{id}/review:
    post:
      operationId: reviewBooking
      tags: [bookings]
      summary: Submit a review for a completed booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ── Subscriptions ────────────────────────────────────────────────────────────
  /subscription-plans:
    get:
      operationId: listSubscriptionPlans
      tags: [subscriptions]
      summary: List all available subscription plans
      responses:
        "200":
          description: List of subscription plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionPlan"

  /subscriptions/current:
    get:
      operationId: getCurrentSubscription
      tags: [subscriptions]
      summary: Get the current user's active subscription
      responses:
        "200":
          description: Active subscription or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSubscription"
        "404":
          $ref: "#/components/responses/NotFound"

  /subscriptions:
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Subscribe to a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSubscription"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ── Dashboard ────────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary for the current user
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/admin/summary:
    get:
      operationId: getAdminSummary
      tags: [dashboard]
      summary: Get admin dashboard summary (worker counts, booking stats)
      responses:
        "200":
          description: Admin summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"

  /dashboard/admin/bookings:
    get:
      operationId: listAllBookings
      tags: [dashboard]
      summary: List all bookings (admin view)
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BookingStatus"
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: All bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"

  /dashboard/admin/users:
    get:
      operationId: listAllUsers
      tags: [dashboard]
      summary: List all registered users (admin view)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"

  /dashboard/admin/workers:
    get:
      operationId: listAllWorkers
      tags: [dashboard]
      summary: List all workers for admin management
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/WorkerStatus"
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: All workers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerListResponse"

    post:
      operationId: createWorker
      tags: [dashboard]
      summary: Create a new worker directly (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkerRequest"
      responses:
        "201":
          description: Created worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"

  /dashboard/admin/workers/{id}/status:
    patch:
      operationId: updateWorkerStatus
      tags: [dashboard]
      summary: Approve or suspend a worker (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkerStatusRequest"
      responses:
        "200":
          description: Updated worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"

components:
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    # ── Auth Schemas ────────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        phone:
          type: string
        address:
          type: string
        role:
          type: string
          enum: [household, admin]
          default: household
      required:
        - name
        - email
        - password

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    # ── User Schemas ────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        role:
          type: string
          enum: [household, admin]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - createdAt

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        address:
          type: string

    # ── Service Schemas ─────────────────────────────────────────────────────────
    Service:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        pricePerHour:
          type: number
        durationHours:
          type: number
        category:
          type: string
          enum: [cleaning, laundry, combined]
        iconUrl:
          type: string
          nullable: true
      required:
        - id
        - name
        - description
        - pricePerHour
        - durationHours
        - category

    # ── Worker Schemas ──────────────────────────────────────────────────────────
    WorkerStatus:
      type: string
      enum: [pending, approved, suspended]

    Worker:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        bio:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        rating:
          type: number
          nullable: true
        totalReviews:
          type: integer
        completedBookings:
          type: integer
        status:
          $ref: "#/components/schemas/WorkerStatus"
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - totalReviews
        - completedBookings
        - status
        - services
        - createdAt

    WorkerListResponse:
      type: object
      properties:
        workers:
          type: array
          items:
            $ref: "#/components/schemas/Worker"
        total:
          type: integer
      required:
        - workers
        - total

    UpdateWorkerStatusRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/WorkerStatus"
      required:
        - status

    CreateWorkerRequest:
      type: object
      properties:
        name:
          type: string
        bio:
          type: string
        phone:
          type: string
        photoUrl:
          type: string
        serviceIds:
          type: array
          items:
            type: integer
      required:
        - name

    AdminUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        role:
          type: string
          enum: [household, admin]
        createdAt:
          type: string
          format: date-time
        bookingCount:
          type: integer
      required:
        - id
        - name
        - email
        - role
        - createdAt
        - bookingCount

    AdminUserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer
      required:
        - users
        - total

    # ── Booking Schemas ─────────────────────────────────────────────────────────
    BookingStatus:
      type: string
      enum: [pending, confirmed, in_progress, completed, cancelled]

    Booking:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        worker:
          $ref: "#/components/schemas/Worker"
        service:
          $ref: "#/components/schemas/Service"
        scheduledDate:
          type: string
          format: date-time
        address:
          type: string
        notes:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/BookingStatus"
        totalPrice:
          type: number
        review:
          $ref: "#/components/schemas/Review"
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - worker
        - service
        - scheduledDate
        - address
        - status
        - totalPrice
        - createdAt

    BookingListResponse:
      type: object
      properties:
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        total:
          type: integer
      required:
        - bookings
        - total

    CreateBookingRequest:
      type: object
      properties:
        workerId:
          type: integer
        serviceId:
          type: integer
        scheduledDate:
          type: string
          format: date-time
        address:
          type: string
        notes:
          type: string
      required:
        - workerId
        - serviceId
        - scheduledDate
        - address

    UpdateBookingStatusRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/BookingStatus"
      required:
        - status

    # ── Review Schemas ──────────────────────────────────────────────────────────
    Review:
      type: object
      properties:
        id:
          type: integer
        bookingId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - bookingId
        - rating
        - createdAt

    CreateReviewRequest:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
      required:
        - rating

    # ── Subscription Schemas ────────────────────────────────────────────────────
    SubscriptionPlan:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        priceMonthly:
          type: number
        bookingsPerMonth:
          type: integer
        discountPercent:
          type: integer
        features:
          type: array
          items:
            type: string
        popular:
          type: boolean
      required:
        - id
        - name
        - description
        - priceMonthly
        - bookingsPerMonth
        - discountPercent
        - features
        - popular

    UserSubscription:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        plan:
          $ref: "#/components/schemas/SubscriptionPlan"
        status:
          type: string
          enum: [active, cancelled, expired]
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        bookingsUsed:
          type: integer
      required:
        - id
        - userId
        - plan
        - status
        - startDate
        - endDate
        - bookingsUsed

    CreateSubscriptionRequest:
      type: object
      properties:
        planId:
          type: integer
      required:
        - planId

    # ── Dashboard Schemas ───────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      properties:
        upcomingBookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        totalBookings:
          type: integer
        activeSubscription:
          $ref: "#/components/schemas/UserSubscription"
          nullable: true
        bookingsThisMonth:
          type: integer
        recentBookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
      required:
        - upcomingBookings
        - totalBookings
        - bookingsThisMonth
        - recentBookings

    AdminSummary:
      type: object
      properties:
        totalWorkers:
          type: integer
        pendingWorkers:
          type: integer
        totalBookings:
          type: integer
        bookingsToday:
          type: integer
        activeSubscriptions:
          type: integer
        revenueThisMonth:
          type: number
        bookingsByStatus:
          type: object
          additionalProperties:
            type: integer
      required:
        - totalWorkers
        - pendingWorkers
        - totalBookings
        - bookingsToday
        - activeSubscriptions
        - revenueThisMonth
        - bookingsByStatus
