# Local end-to-end stack: Postgres + schema push + the single-container app.
#
#   docker compose up --build          # build, push schema, start on :8080
#   docker compose run --rm migrate pnpm --filter @workspace/db run seed
#
# Production hosts should supply DATABASE_URL from their own managed Postgres
# instead of the `db` service below.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meraki
      POSTGRES_PASSWORD: meraki
      POSTGRES_DB: meraki
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meraki -d meraki"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: pushes the Drizzle schema, then exits. `app` waits for success.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://meraki:meraki@db:5432/meraki
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgres://meraki:meraki@db:5432/meraki
      NODE_ENV: production
      PORT: "8080"
      WEB_DIST: /app/web
      LOG_LEVEL: info
      # Used for password-reset links: <APP_URL>/reset-password/<token>
      APP_URL: http://localhost:8080
      # Add any extra browser origin that must call the API:
      # ALLOWED_ORIGINS: https://app.example.com
      # Password reset email — without a key the link is only logged.
      # RESEND_API_KEY: re_...
      # MAIL_FROM: Meraki <no-reply@example.com>
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
