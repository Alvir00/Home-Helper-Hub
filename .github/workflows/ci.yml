name: CI

on:
  # Any branch, so a feature branch gets verified without opening a PR.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # This is the gate that a Windows checkout cannot run: the workspace ships
      # linux-x64-only esbuild/rollup binaries, so typechecking has to happen on
      # Linux (CI, WSL, or the Docker builder stage).
      - name: Typecheck
        run: pnpm run typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Build web
        run: pnpm --filter @workspace/meraki-web run build
        env:
          PORT: "8080"
          BASE_PATH: /
          NODE_ENV: production

  docker:
    name: Docker image and end-to-end smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meraki
          POSTGRES_PASSWORD: meraki
          POSTGRES_DB: meraki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meraki -d meraki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://meraki:meraki@127.0.0.1:5432/meraki
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-admin-password-123

    steps:
      - uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --target runner -t meraki:ci .

      - name: Build migration and seed images
        run: |
          docker build --target migrate -t meraki:migrate .
          docker build --target seed -t meraki:seed .

      - name: Apply migrations
        run: docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" meraki:migrate

      - name: Seed admin and demo data
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e ADMIN_EMAIL="$ADMIN_EMAIL" \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e SEED_DEMO_DATA=1 \
            meraki:seed

      - name: Start the app
        run: |
          docker run -d --name meraki --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e NODE_ENV=production \
            -e PORT=8080 \
            -e WEB_DIST=/app/web \
            -e APP_URL=http://127.0.0.1:8080 \
            meraki:ci

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/readyz; then
              echo " ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready"
          docker logs meraki
          exit 1

      - name: Smoke test
        run: |
          BASE_URL=http://127.0.0.1:8080 \
          ADMIN_EMAIL="$ADMIN_EMAIL" \
          ADMIN_PASSWORD="$ADMIN_PASSWORD" \
          CHECK_WEB=1 \
          bash scripts/smoke-test.sh

      - name: Container logs
        if: always()
        run: docker logs meraki || true

      - name: Scan image for known vulnerabilities (report only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: meraki:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
